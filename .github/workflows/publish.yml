name: publish
run-name: "OpenTmux • Publish • Run #${{ github.run_number }} • ${{ github.event_name == 'schedule' && 'Nightly@Dev' || github.ref_name == 'Dev' && 'Edge@Dev' || github.ref_name }}"

on:
  push:
    branches: [Stable, Beta, Dev]
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish prerelease even if no changes since last rolling tag
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

env:
  TARGET_REF: ${{ github.event_name == 'schedule' && 'Dev' || github.ref_name }}

jobs:
  check-prerelease:
    name: Check for publish changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      since_sha: ${{ steps.diff.outputs.since_sha }}
      ahead_count: ${{ steps.diff.outputs.ahead_count }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine diff vs rolling prerelease tag
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "Stable" ] || [ "${GITHUB_REF_NAME}" = "Beta" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(release)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TAG="opentmux-nightly"
          else
            TAG="opentmux-edge"
          fi

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "since_sha=(none)" >> "$GITHUB_OUTPUT"
            echo "ahead_count=INIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SINCE_SHA="$(git rev-list -n 1 "$TAG")"
          echo "since_sha=$SINCE_SHA" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$TAG"..HEAD -- .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ahead_count=0" >> "$GITHUB_OUTPUT"
          else
            AHEAD="$(git rev-list --count "$TAG"..HEAD -- .)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ahead_count=$AHEAD" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish to npm
    needs: [check-prerelease]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Clear npm token env (force OIDC)
        run: |
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_TOKEN=" >> "$GITHUB_ENV"

      - name: Compute publish metadata
        id: meta
        shell: bash
        env:
          FORCE_ROLLING: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
          if [ "${GITHUB_REF_NAME:-}" = "Stable" ]; then
            VERSION="$BASE_VERSION"
            DIST_TAG="latest"
            SHOULD_PUBLISH="true"
          elif [ "${GITHUB_REF_NAME:-}" = "Beta" ]; then
            VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
            DIST_TAG="beta"
            SHOULD_PUBLISH="true"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            VERSION="${BASE_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="nightly"
            if [ "${{ needs.check-prerelease.outputs.changed || 'false' }}" = "true" ] || [ "${FORCE_ROLLING}" = "true" ]; then
              SHOULD_PUBLISH="true"
            else
              SHOULD_PUBLISH="false"
            fi
          else
            VERSION="${BASE_VERSION}-edge.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            DIST_TAG="edge"
            if [ "${{ needs.check-prerelease.outputs.changed || 'false' }}" = "true" ] || [ "${FORCE_ROLLING}" = "true" ]; then
              SHOULD_PUBLISH="true"
            else
              SHOULD_PUBLISH="false"
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stop when prerelease is unchanged
        if: steps.meta.outputs.should_publish != 'true'
        run: |
          echo "No publish changes since last rolling tag; skipping."

      - name: Install dependencies
        if: steps.meta.outputs.should_publish == 'true'
        run: bun install

      - name: Build
        if: steps.meta.outputs.should_publish == 'true'
        run: bun run build

      - name: Apply publish version
        if: steps.meta.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          npm pkg set version="${RELEASE_VERSION}"

      - name: Verify npm package contents
        if: steps.meta.outputs.should_publish == 'true'
        run: npm pack --dry-run

      - name: Publish npm package
        if: steps.meta.outputs.should_publish == 'true'
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ""

      - name: Update rolling prerelease tag
        if: steps.meta.outputs.should_publish == 'true' && (steps.meta.outputs.dist_tag == 'nightly' || steps.meta.outputs.dist_tag == 'edge')
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.DIST_TAG === 'edge' ? 'opentmux-edge' : 'opentmux-nightly';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: process.env.TARGET_SHA || context.sha });
